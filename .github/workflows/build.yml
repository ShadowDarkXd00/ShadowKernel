name: ShadowKernel Build

# Builds ShadowKernel by Vortex (Linux 4.14 / Xiaomi Miatoll SM6250) with
# KernelSU-Next integrated and packages a flashable AnyKernel3 zip that works
# on MIUI/HyperOS and custom ROMs.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig to build'
        required: false
        default: 'vendor/xiaomi/miatoll_defconfig'
      toolchain:
        description: 'Clang toolchain'
        required: false
        type: choice
        default: 'neutron'
        options:
          - neutron
          - zyc-clang-16
          - zyc-clang-14
      extra_configs:
        description: 'Extra configs (space separated, e.g. "CONFIG_LTO_CLANG=y")'
        required: false
        default: ''
      publish_release:
        description: 'Publish the flashable zip as a GitHub release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (only used when publishing a release)'
        required: false
        default: ''
  push:
    branches:
      - main
      - arena/d32101a9-shadowkernel
    paths-ignore:
      - '**.md'
      - 'Documentation/**'

permissions:
  contents: write

concurrency:
  group: shadowkernel-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'vendor/xiaomi/miatoll_defconfig' }}
  TOOLCHAIN: ${{ github.event.inputs.toolchain || 'neutron' }}
  EXTRA_CONFIGS: ${{ github.event.inputs.extra_configs || '' }}
  KBUILD_BUILD_USER: Vortex
  KBUILD_BUILD_HOST: ShadowKernel
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 4G
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Compile ShadowKernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout ShadowKernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev libncursesw5-dev python3 python-is-python3 \
            ccache zip unzip curl wget rsync xz-utils zstd \
            cpio kmod lz4 lzop device-tree-compiler git

      - name: Verify KernelSU-Next integration
        run: |
          set -e
          echo "==> Checking KernelSU-Next manual hook call sites"
          for pair in "fs/open.c:ksu_handle_faccessat" \
                      "fs/exec.c:ksu_handle_execveat" \
                      "fs/stat.c:ksu_handle_stat" \
                      "fs/read_write.c:ksu_handle_sys_read" \
                      "kernel/reboot.c:ksu_handle_sys_reboot" \
                      "drivers/input/input.c:ksu_handle_input_handle_event"; do
            file="${pair%%:*}"; sym="${pair##*:}"
            grep -q "$sym" "$file" || { echo "!! MISSING $sym in $file"; exit 1; }
            echo "  ok: $sym -> $file"
          done
          test -f drivers/kernelsu/Kbuild || { echo "!! drivers/kernelsu is missing"; exit 1; }
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo "==> KernelSU-Next integration is intact"

      - name: Cache Clang toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: shadowkernel-toolchain-${{ runner.os }}-${{ env.TOOLCHAIN }}-v1

      - name: Setup Clang toolchain
        run: |
          set -e
          mkdir -p toolchains
          case "$TOOLCHAIN" in
            neutron)
              REPO=Neutron-Toolchains/clang-build-catalogue; TAG=06092026
              ASSET=neutron-clang-$TAG.tar.zst; DIR=toolchains/neutron; KIND=zst ;;
            zyc-clang-16)
              REPO=ZyCromerZ/Clang; TAG=16.0.6-20260807-release
              ASSET=Clang-16.0.6-20260807.tar.gz; DIR=toolchains/zyc-16; KIND=gz ;;
            *)
              REPO=ZyCromerZ/Clang; TAG=14.0.6-20261011-release
              ASSET=Clang-14.0.6-20261011.tar.gz; DIR=toolchains/zyc-14; KIND=gz ;;
          esac
          URL="https://github.com/$REPO/releases/download/$TAG/$ASSET"

          # Layout independent: the release archives either wrap the toolchain in
          # a directory whose name changes between builds (zyc) or drop bin/ at
          # the top level (neutron). Also, clang is often a symlink, so look for
          # a directory that contains an executable clang instead of scanning
          # for regular files.
          find_clang_bin() {
            for d in "$1" $(find "$1" -type d 2>/dev/null); do
              # -x alone also matches a directory, hence the -d guard
              if [ -x "$d/clang" ] && [ ! -d "$d/clang" ]; then
                printf '%s\n' "$d"; return 0
              fi
            done
            return 0
          }

          CLANG_BIN="$(find_clang_bin "$DIR" || true)"
          if [ -n "$CLANG_BIN" ] && [ -x "$CLANG_BIN/clang" ] && [ ! -d "$CLANG_BIN/clang" ]; then
            echo "==> Toolchain cache hit: $CLANG_BIN"
          else
            echo "==> Downloading $ASSET"
            TARBALL="$RUNNER_TEMP/$ASSET"
            rm -rf "$DIR" && mkdir -p "$DIR"
            curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 -o "$TARBALL" "$URL"
            ls -lh "$TARBALL"
            ok=0
            case "$KIND" in
              zst)
                tar --zstd -xf "$TARBALL" -C "$DIR" && ok=1
                if [ "$ok" != 1 ]; then
                  echo "==> tar --zstd failed, retrying with an explicit zstd window"
                  zstd -dc --long=31 "$TARBALL" | tar -xf - -C "$DIR" && ok=1
                fi ;;
              *)
                tar -xzf "$TARBALL" -C "$DIR" && ok=1 ;;
            esac
            if [ "$ok" != 1 ]; then
              echo "::error title=toolchain extraction failed::$ASSET ($(du -h "$TARBALL" | cut -f1) from $URL) could not be unpacked"
              exit 1
            fi
            echo "==> extracted layout:"
            find "$DIR" -maxdepth 2 | head -20
            CLANG_BIN="$(find_clang_bin "$DIR" || true)"
            rm -f "$TARBALL"
          fi

          # Kbuild re-execs make with -C $(KBUILD_OUTPUT) for O= builds, so a
          # relative PATH entry stops resolving the moment make leaves the
          # workspace root and every tool would fail with "ld.lld: not found"
          # (the first casualty is scripts/Kbuild.include's __ld-name probe,
          # which shells out to $(LD) -v during makefile parsing). Make the
          # toolchain path absolute before it goes anywhere near $GITHUB_PATH.
          if [ -n "$CLANG_BIN" ]; then
            CLANG_BIN="$(cd "$CLANG_BIN" && pwd)"
          fi

          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ] || [ -d "$CLANG_BIN/clang" ]; then
            echo "::error title=clang not found::no executable clang under $DIR - clang* entries: $(find "$DIR" -name 'clang*' 2>/dev/null | head -15 | tr '\n' ' ') - top level: $(find "$DIR" -maxdepth 2 2>/dev/null | head -15 | tr '\n' ' ')"
            exit 1
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          "$CLANG_BIN/clang" --version | head -3
          echo "==> LLVM tools:"
          ls "$CLANG_BIN" | grep -E '^(ld\.lld|llvm-ar|llvm-nm|llvm-objcopy|llvm-objdump|llvm-strip)$' || echo "  (none found)"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: shadowkernel-ccache-${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Makefile', 'arch/arm64/configs/vendor/xiaomi/miatoll_defconfig', 'drivers/kernelsu/Kbuild') }}-${{ github.sha }}
          restore-keys: |
            shadowkernel-ccache-${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Makefile', 'arch/arm64/configs/vendor/xiaomi/miatoll_defconfig', 'drivers/kernelsu/Kbuild') }}-
            shadowkernel-ccache-${{ runner.os }}-${{ env.TOOLCHAIN }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --zero-stats || true
          ccache --show-config

      - name: Generate .config
        run: |
          set -e
          rm -rf out
          make O=out ARCH=arm64 "$DEFCONFIG"

          if [ -n "$EXTRA_CONFIGS" ]; then
            echo "==> Applying extra configs: $EXTRA_CONFIGS"
            for cfg in $EXTRA_CONFIGS; do
              key="${cfg%%=*}"; val="${cfg#*=}"
              case "$val" in
                y) scripts/config --file out/.config -e "$key" ;;
                n) scripts/config --file out/.config -d "$key" ;;
                m) scripts/config --file out/.config -m "$key" ;;
                *) scripts/config --file out/.config --set-val "$key" "$val" ;;
              esac
            done
          fi

          make O=out ARCH=arm64 olddefconfig

      - name: Validate .config
        run: |
          set -e
          CFG=out/.config

          echo "==> Kernel identity"
          grep -E '^CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|DEFAULT_HOSTNAME)=' $CFG || true

          echo "==> KernelSU-Next"
          grep -E '^CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_DEBUG|KPROBES)=' $CFG || true
          grep -q '^CONFIG_KSU=y' $CFG || { echo "!! CONFIG_KSU is not enabled"; exit 1; }
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' $CFG || { echo "!! CONFIG_KSU_MANUAL_HOOK is not enabled"; exit 1; }
          grep -q '^CONFIG_EXT4_FS=y' $CFG || { echo "!! CONFIG_EXT4_FS is required by KernelSU-Next"; exit 1; }

          echo "==> Kernel loader / module support"
          grep -E '^CONFIG_(MODULES|MODULE_UNLOAD|MODULE_FORCE_LOAD|MODULE_SIG|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|TRIM_UNUSED_KSYMS|TMPFS_XATTR)=' $CFG || true
          grep -q '^CONFIG_MODULES=y' $CFG || { echo "!! CONFIG_MODULES is not enabled - kernel loaders (LKM) could not work"; exit 1; }
          grep -q '^CONFIG_KALLSYMS=y' $CFG || { echo "!! CONFIG_KALLSYMS is not enabled"; exit 1; }
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' $CFG; then
            echo "!! CONFIG_MODULE_SIG_FORCE is enabled - unsigned kernel modules cannot be loaded"
            exit 1
          fi

          echo "==> Android / custom ROM compatibility"
          grep -E '^CONFIG_(ANDROID_BINDER_IPC|ANDROID_BINDERFS|ASHMEM|TMPFS_XATTR|EXT4_FS_SECURITY|F2FS_FS_SECURITY|SECURITY_SELINUX|DM_VERITY|OVERLAY_FS)=' $CFG || true
          for opt in ANDROID_BINDER_IPC SECURITY_SELINUX EXT4_FS_SECURITY TMPFS_XATTR OVERLAY_FS; do
            grep -q "^CONFIG_$opt=y" $CFG || { echo "!! CONFIG_$opt is not enabled - custom ROMs may misbehave"; exit 1; }
          done

          # The AnyKernel3 zip ships the kernel image only, so every driver the
          # device needs must be built in. Fail loudly instead of silently
          # producing modules that would never be installed on the device.
          if grep -q '=m$' $CFG; then
            echo "!! The configuration contains loadable modules (=m):"
            grep '=m$' $CFG || true
            exit 1
          fi
          echo "==> Configuration OK (fully built-in kernel)"

      - name: Resolve kernel version
        run: |
          set -e
          KVER=$(make -s O=out ARCH=arm64 kernelrelease | tail -1)
          echo "KERNEL_VERSION=$KVER" >> "$GITHUB_ENV"
          echo "==> Kernel release string: $KVER"
          echo "- Kernel release: \`$KVER\`" >> $GITHUB_STEP_SUMMARY
          echo "- Defconfig: \`$DEFCONFIG\`" >> $GITHUB_STEP_SUMMARY
          echo "- Toolchain: \`$TOOLCHAIN\`" >> $GITHUB_STEP_SUMMARY
          echo "- KernelSU-Next: \`v3.4.0-legacy (33294)\`" >> $GITHUB_STEP_SUMMARY

      - name: Build ShadowKernel
        run: |
          set -o pipefail
          # turn any unexpected failure into a check-run annotation as well, so
          # the cause is visible without the Actions log archive
          trap 'echo "::error title=build step failed::line $LINENO: ${BASH_COMMAND:0:300}"' ERR
          export PATH="$CLANG_BIN:$PATH"
          export KBUILD_BUILD_TIMESTAMP="$(git log -1 --pretty=%cd --date=format:'%Y-%m-%d %H:%M:%S')"

          # The toolchains ship LLVM binutils, not GNU cross binutils, so the
          # default $(CROSS_COMPILE)ld / objcopy / ar would abort with
          # "Error 127: not found" (first hit: linking arch/arm64/kernel/vdso).
          # This tree understands ld-name=lld and adds -fuse-ld=lld itself.
          if ! command -v ld.lld >/dev/null 2>&1; then
            echo "::error title=ld.lld missing::no ld.lld on PATH ($CLANG_BIN) - linkers present: $(ls "$CLANG_BIN" | grep -E '^(ld|lld)' | tr '\n' ' ')"
            exit 1
          fi
          TOOLS="LD=ld.lld"
          for pair in AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip; do
            tool="${pair#*=}"
            if command -v "$tool" >/dev/null 2>&1; then
              TOOLS="$TOOLS $pair"
            else
              echo "!! $tool not found - leaving the default for ${pair%%=*}"
            fi
          done
          echo "==> tool overrides:$TOOLS"
          # NB: no `| head -1` here, pipefail + SIGPIPE would kill the step
          clang --version || true
          ld.lld --version || true

          # shellcheck disable=SC2086
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM_IAS=1 \
            $TOOLS \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          # CI logs are not always easy to reach from outside, so surface the
          # first compiler errors as a check-run annotation.
          set +e
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "::warning title=no build log::the build log was not created"; exit 0; }
          ERRS=$(grep -nE "error:|fatal error:|Error [0-9]+$|\*\*\* \[|not found|No such file or directory" "$LOG" | head -6)
          [ -n "$ERRS" ] || ERRS=$(tail -15 "$LOG")
          MSG=$(echo "$ERRS" | tr '\n' '|' | cut -c1-1400)
          echo "::error title=ShadowKernel build errors::${MSG}"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Check that the build did not modify tracked sources
        run: |
          if [ -n "$(git status --porcelain -- . ':!out' ':!.ccache' ':!toolchains')" ]; then
            echo "!! The build modified tracked files:"
            git status --porcelain
            exit 1
          fi
          echo "==> Source tree is clean"

      - name: Collect kernel artifacts
        run: |
          set -e
          mkdir -p artifacts
          BOOT=out/arch/arm64/boot

          KERNEL_IMAGE=""
          for img in Image.gz-dtb Image.gz Image.lz4 Image; do
            if [ -f "$BOOT/$img" ]; then
              cp "$BOOT/$img" artifacts/
              KERNEL_IMAGE="$img"
              break
            fi
          done
          [ -n "$KERNEL_IMAGE" ] || { echo "!! No kernel image was produced"; exit 1; }
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"
          # KERNEL_IMAGE is a bare basename, so remember the full path as well:
          # the packaging step copies the image into the AnyKernel3 root and it
          # must not depend on the image already living in the tree root.
          echo "KERNEL_IMAGE_PATH=$BOOT/$KERNEL_IMAGE" >> "$GITHUB_ENV"
          echo "==> Kernel image: $KERNEL_IMAGE ($(du -h "$BOOT/$KERNEL_IMAGE" | cut -f1))"

          cp out/System.map artifacts/ 2>/dev/null || true
          cp out/.config artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Package AnyKernel3 flashable zip
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git AK3/README.md AK3/.github AK3/anykernel.sh
          cp "$KERNEL_IMAGE_PATH" AK3/
          cp anykernel.sh AK3/anykernel.sh
          chmod +x AK3/anykernel.sh

          ZIP="ShadowKernel-${KERNEL_VERSION}-$(date -u +%Y%m%d).zip"
          ( cd AK3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          ls -lh "$ZIP"

      - name: Verify the flashable zip layout
        run: |
          set -e
          # unzip -Z1 prints entry names only, so grep -x gives an exact match
          # instead of a substring hit somewhere inside a path.
          LIST=$(unzip -Z1 "$ZIP_NAME")
          echo "$LIST" | grep -qxE '(\./)?anykernel.sh' || { echo "!! anykernel.sh missing"; exit 1; }
          echo "$LIST" | grep -qxE "(\./)?$KERNEL_IMAGE" || { echo "!! kernel image ($KERNEL_IMAGE) missing"; exit 1; }
          echo "$LIST" | grep -qxE '(\./)?tools/ak3-core.sh' || { echo "!! AnyKernel3 core tools missing"; exit 1; }

          unzip -p "$ZIP_NAME" anykernel.sh > "$RUNNER_TEMP/ak-anykernel.sh"
          grep -q 'kernel.string=ShadowKernel' "$RUNNER_TEMP/ak-anykernel.sh" || { echo "!! branding missing"; exit 1; }
          grep -q 'device.name1=curtana' "$RUNNER_TEMP/ak-anykernel.sh" || { echo "!! device check missing"; exit 1; }

          # AnyKernel3 resolves the target partition itself, so BLOCK must be a
          # single partition *name* ("boot"), one /dev/... path or "auto". A
          # ';'-separated device list is parsed as one single name by
          # setup_ak() and ends in `abort "Unable to determine <value>
          # partition"`; a hardcoded path breaks on recoveries with a different
          # by-name layout. Both are rejected here on purpose.
          BLOCK_LINE=$(grep -m1 '^BLOCK=' "$RUNNER_TEMP/ak-anykernel.sh" || true)
          [ -n "$BLOCK_LINE" ] || { echo "!! BLOCK is not set in anykernel.sh"; exit 1; }
          # strip the trailing ';' AK3 config lines end with
          BLOCK_VALUE=$(printf '%s' "$BLOCK_LINE" | sed -e 's/^BLOCK=//' -e 's/;$//')

          case "$BLOCK_VALUE" in
            *';'*) echo "!! BLOCK must be a single partition, not a ';'-separated"
                   echo "!! device list (setup_ak would abort): $BLOCK_LINE"
                   exit 1 ;;
            /dev/*) echo "!! BLOCK uses a hardcoded device path, which breaks on"
                    echo "!! other recoveries/ROMs - use a partition name: $BLOCK_LINE"
                    exit 1 ;;
            boot|auto|kernel|recovery|init_boot)
              echo "==> BLOCK ok: $BLOCK_LINE" ;;
            *) echo "!! unexpected BLOCK value: '$BLOCK_VALUE'"; exit 1 ;;
          esac

          grep -qE '^IS_SLOT_DEVICE=(auto|0|1);[[:space:]]*$' "$RUNNER_TEMP/ak-anykernel.sh" \
            || { echo "!! IS_SLOT_DEVICE is missing or malformed"; exit 1; }

          echo "==> $ZIP_NAME looks good"

      - name: Upload flashable AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ShadowKernel-flashable-${{ github.run_number }}
          path: ShadowKernel-*.zip
          if-no-files-found: error

      - name: Upload raw kernel images
        uses: actions/upload-artifact@v4
        with:
          name: ShadowKernel-images-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowKernel-buildlog-${{ github.run_number }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="shadow-$(date -u +%Y%m%d-%H%M)"

          cat > /tmp/notes.md <<'EOF'
          ShadowKernel by Vortex for the Xiaomi Miatoll (SM6250) family.

          - Linux 4.14.357 base, tuned for custom ROMs and MIUI/HyperOS
          - KernelSU-Next (manual hook mode) integrated, version 33294
          - LKM friendly: unsigned modules can be loaded (KernelSU-Next LKM, susfs, KernelPatch)
          - Flash the attached zip with TWRP/OrangeFox or a kernel flasher app

          Manager APK: KernelSU-Next v3.4.0 (33294)
          EOF

          gh release create "$TAG" ShadowKernel-*.zip \
            --title "ShadowKernel $TAG" \
            --notes-file /tmp/notes.md \
            --target "${{ github.sha }}"
          echo "- Release published: \`$TAG\`" >> $GITHUB_STEP_SUMMARY

      - name: Build summary
        if: always()
        run: |
          {
            echo "### ShadowKernel build result"
            echo ""
            echo "- Status: ${{ job.status }}"
            ls -lh ShadowKernel-*.zip 2>/dev/null || true
            ls -lh artifacts/ 2>/dev/null || true
          } >> $GITHUB_STEP_SUMMARY
